<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feux près de moi — France</title>
  <meta name="description" content="Le niveau de danger feux de forêt près de chez vous, aujourd'hui et demain, et ce qu'il implique.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <div class="shell" id="shell" data-mode="simple">

    <aside class="rail" id="rail">
      <div class="rail-head">
        <div class="brand">Feux<span>·</span>Près<span>·</span>De<span>·</span>Moi</div>
        <button class="btn-lang" id="lang">English</button>
      </div>

      <button class="locate" id="locate">Vérifier près de chez moi</button>

      <div class="place" id="place" hidden>
        <b id="place-name"></b>
        <button id="change-place">Changer</button>
      </div>

      <div class="picker" id="picker">
        <label for="place-search" id="picker-label">Ou cherchez une adresse</label>
        <input type="search" id="place-search" autocomplete="off" spellcheck="false"
               placeholder="Adresse, ville ou village">
        <ul id="place-results"></ul>
      </div>

      <div class="answer" id="answer" hidden aria-live="polite">
        <span class="tag" id="tag"><i></i><span id="tag-text"></span></span>
        <h2 id="headline"></h2>
        <p id="subline"></p>
      </div>

      <dl class="facts" id="facts" hidden></dl>

      <!-- Unconditional. France broadcasts evacuation orders by FR-Alert
           straight to phones, so this map cannot see them and must never let
           its silence read as "no order exists". -->
      <div class="official" id="alert-box">
        <p id="alert-text"></p>
        <a id="alert-link" href="https://www.interieur.gouv.fr/Alerte/FR-Alert" rel="noopener"></a>
      </div>

      <div class="rail-foot">
        <span class="live" id="freshness"><i></i><span id="freshness-text">Chargement…</span></span>
        <a href="zone.html" id="zone-link">Vue locale</a>
        <a href="sources.html" id="src-link">D'où viennent ces données</a>
        <a href="../" id="ca-link">Canada</a>
      </div>
    </aside>

    <div class="map">
      <div id="map"></div>

      <details class="toolbar" id="toolbar" open>
        <summary data-t="layersToggle">Calques</summary>
        <div class="toolbar-body">
          <button class="chip" data-layer="orders" aria-pressed="true">
            <i class="sw order"></i><span data-t="chipOrders">Zones évacuées</span>
          </button>
          <button class="chip" data-layer="rain" aria-pressed="false">
            <i class="sw aqhi"></i><span data-t="chipRain">Pluie</span>
          </button>
          <button class="chip" data-layer="fires" aria-pressed="true">
            <i class="sw fire"></i><span data-t="chipFires">Feux détectés</span>
          </button>
          <button class="chip" data-layer="closures" aria-pressed="true">
            <i class="sw road"></i><span data-t="chipClosures">Routes coupées</span>
          </button>
          <button class="chip" data-layer="aircraft" aria-pressed="true">
            <i class="sw plane"></i><span data-t="chipAircraft">Moyens aériens</span>
          </button>
          <button class="chip" data-layer="danger" aria-pressed="true">
            <i class="sw hist"></i><span data-t="chipDanger">Danger par département</span>
          </button>
          <button class="chip" data-layer="aqhi" aria-pressed="false">
            <i class="sw aqhi"></i><span data-t="chipAir">Qualité de l'air</span>
          </button>
          <button class="chip" data-layer="satellite" aria-pressed="false" data-adv>
            <i class="sw sat"></i><span data-t="chipSatellite">Image satellite</span>
          </button>
          <button class="chip" data-layer="history" aria-pressed="false" id="chip-trail" data-adv>
            <i class="sw hist"></i><span data-t="trailChip">Chaleur sur 7 jours</span>
          </button>

          <label class="seg scar-pick" id="scar-pick" data-adv>
            <span id="scar-label" data-t="scarLabel">Saison passée</span>
            <select id="scar-year" data-t-aria="ariaScar" aria-label="Zones brûlées, saison passée">
              <option value="" data-t="scarNone">Aucune</option>
            </select>
          </label>

          <div class="seg basemap" id="basemap" role="group"
               data-t-aria="ariaBasemap" aria-label="Fond de carte">
            <button data-base="plain" aria-pressed="true" data-t="baseMap">Carte</button>
            <button data-base="imagery" aria-pressed="false" data-t="baseSatellite">Satellite</button>
          </div>
      
        </div>
      </details>

      <div class="detail-dial" id="dial">
        <span class="label" data-t="detailLabel">Détail</span>
        <div class="seg" id="modes" role="group"
             data-t-aria="ariaModes" aria-label="Niveau de détail">
          <button data-mode="minimal" aria-pressed="false" data-t="modeMinimal">Minimal</button>
          <button data-mode="simple" aria-pressed="true" data-t="modeSimple">Simple</button>
          <button data-mode="advanced" aria-pressed="false" data-t="modeAdvanced">Avancé</button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="../js/app-fr.js"></script>
</body>
</html>
