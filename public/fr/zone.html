<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue locale — Feux près de moi</title>
  <meta name="description" content="Les cinquante kilomètres autour d'une adresse : la chaleur détectée, où le modèle la fait aller, les routes coupées, ce qui vole au-dessus.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../css/app.css">
  <style>
    /* Page-scoped: the local view's own blocks. Everything else reuses app.css. */
    .zone-pick { padding: 0 20px 14px; }
    .zone-pick select { width: 100%; }
    select, .skills summary {
      font-family: var(--sans); font-size: 0.9rem;
      color: var(--ink); background: var(--raised);
      border: 1px solid var(--line); border-radius: var(--r);
      padding: 8px 10px;
    }
    .block { padding: 14px 20px; border-top: 1px solid var(--line-soft); }
    .block[hidden] { display: none; }
    .block h3 {
      margin: 0 0 8px; font-family: var(--mono); font-size: 0.67rem;
      text-transform: uppercase; letter-spacing: 0.11em; color: var(--faint);
      font-weight: 500;
    }
    .block p { margin: 0 0 6px; font-size: 0.9rem; color: var(--muted); }
    .block b { color: var(--ink); }
    .block ul { margin: 0; padding-left: 18px; font-size: 0.88rem; color: var(--muted); }
    .block li { margin-bottom: 6px; }
    .verdict { font-size: 1rem; color: var(--ink); }
    .verdict.toward { color: var(--danger); }
    .skills summary { cursor: pointer; list-style: none; }
    .skills summary::-webkit-details-marker { display: none; }
    .skills label {
      display: flex; gap: 8px; align-items: flex-start;
      margin-top: 9px; font-size: 0.88rem; color: var(--muted);
    }
    .skills input { accent-color: var(--accent); margin-top: 2px; }
    .actions { margin: 12px 0 0; padding: 0; list-style: none; }
    .actions li {
      padding: 10px 0; border-top: 1px solid var(--line-soft); font-size: 0.9rem;
    }
    .actions .why { display: block; margin-top: 3px; color: var(--muted); font-size: 0.84rem; }
    .actions .chan {
      display: block; margin-top: 4px;
      font-family: var(--mono); font-size: 0.72rem; color: var(--accent);
    }
    /* A sentence, not a control. As a plain .chip it inherited white-space:
       nowrap and rendered as a 350px-wide button lying across the map, looking
       pressable. */
    .chip.hint {
      cursor: default; color: var(--muted);
      white-space: normal; max-width: 34ch; line-height: 1.45;
      background: none; border-color: transparent;
    }
    .imagery-pick { display: flex; align-items: center; gap: 8px; }
    .imagery-pick select { font-size: 0.78rem; padding: 5px 7px; max-width: 15rem; }
  </style>
</head>
<body>
  <div class="shell" id="shell" data-mode="simple">

    <aside class="rail" id="rail">
      <div class="rail-head">
        <div class="brand">Vue<span>·</span>Locale</div>
        <button class="btn-lang" id="lang">English</button>
      </div>

      <div class="zone-pick">
        <label for="zone-select" id="zone-label" class="block h3"></label>
        <select id="zone-select"></select>
      </div>

      <!-- 1. Am I in danger, how far, how urgently. -->
      <div class="answer" id="answer" aria-live="polite">
        <span class="tag" id="tag"><i></i><span id="tag-text"></span></span>
        <h2 id="headline">Chargement…</h2>
        <p id="subline"></p>
      </div>

      <dl class="facts" id="facts"></dl>

      <!-- 2. Where is it going. -->
      <div class="block" id="spread-block" hidden>
        <h3 id="spread-title">Où le feu se dirige</h3>
        <p class="verdict" id="spread-verdict"></p>
        <ul id="spread-arcs"></ul>
        <p id="spread-caveat"></p>
      </div>

      <!-- 3. Where must I not go. -->
      <div class="block" id="avoid-block">
        <h3 id="avoid-title">Où ne pas aller</h3>
        <p id="avoid-note"></p>
        <ul id="avoid-list"></ul>
      </div>

      <!-- 3b. Which roads lead into the modelled path. A narrowing of attention,
           never a direction: the model has one fuel type and is validated against
           no real fire. -->
      <div class="block" id="egress-block" hidden>
        <h3 id="egress-title"></h3>
        <p id="egress-note"></p>
        <ul id="egress-list"></ul>
        <p id="egress-caveat"></p>
      </div>

      <!-- 4. Who is fighting it. An observation, never a claim about the
           response — and the ground note is unconditional. -->
      <div class="block" id="forces-block">
        <h3 id="forces-title">Moyens visibles</h3>
        <p id="forces-air"></p>
        <p id="forces-ground"></p>
      </div>

      <!-- 5. What can I do. -->
      <div class="block skills" id="skills-block">
        <details id="skills-details">
          <summary id="skills-summary">Ce que je peux faire</summary>
          <div id="skills-list"></div>
        </details>
        <ul class="actions" id="actions"></ul>
      </div>

      <div class="official" id="alert-box">
        <p id="alert-text"></p>
        <a id="alert-link" href="https://www.interieur.gouv.fr/Alerte/FR-Alert" rel="noopener"></a>
      </div>

      <div class="rail-foot">
        <span class="live" id="freshness"><i></i><span id="freshness-text">Chargement…</span></span>
        <a href="./" id="back-link">Carte France</a>
        <a href="sources.html" id="src-link">Sources</a>
        <a href="chronologie.html" id="chrono-link">Chronologie</a>
        <a href="entraide.html" id="help-link">Où trouver de l'aide</a>
        <a href="pro.html" id="pro-link">Vue pompiers</a>
      </div>
    </aside>

    <div class="map">
      <div id="map"></div>

      <div class="toolbar" id="toolbar">
        <button class="chip" data-layer="fires" aria-pressed="true">
          <i class="sw fire"></i><span data-t="chipFires">Feux détectés</span>
        </button>
        <button class="chip" data-layer="spread" aria-pressed="true">
          <i class="sw hist"></i><span data-t="chipSpread">Propagation modélisée</span>
        </button>
        <button class="chip" data-layer="closures official" aria-pressed="true">
          <i class="sw road"></i><span data-t="chipClosures">Routes coupées</span>
        </button>
        <button class="chip" data-layer="detail" aria-pressed="true">
          <i class="sw sat"></i><span data-t="chipDetail">Bâtiments et rues</span>
        </button>
        <button class="chip" data-layer="evacuated" aria-pressed="true" id="chip-evacuated">
          <i class="sw order"></i><span data-t="chipEvacuated">Communes évacuées</span>
        </button>
        <button class="chip" data-layer="burnt" aria-pressed="true" id="chip-burnt">
          <i class="sw hist"></i><span data-t="chipBurnt">Déjà brûlé</span>
        </button>
        <button class="chip" data-layer="egress" aria-pressed="false" id="chip-egress">
          <i class="sw road"></i><span data-t="chipEgress">Routes vers le feu</span>
        </button>
        <button class="chip" data-layer="history" aria-pressed="false" id="chip-trail">
          <i class="sw hist"></i><span data-t="trailChip">Chaleur sur 7 jours</span>
        </button>

        <button class="chip clear" id="clear-layers" type="button">
          <span data-t="clearLayers">Tout masquer</span>
        </button>

        <span class="chip hint" id="detail-hint" hidden></span>

        <div class="imagery-pick">
          <select id="imagery" data-t-aria="imageryLabel" aria-label="Image satellite">
            <option value="" data-t="noImagery">Aucune image</option>
          </select>
          <span class="pick-note" id="imagery-note"></span>
        </div>

        <div class="seg basemap" id="basemap" role="group"
             data-t-aria="ariaBasemap" aria-label="Fond de carte">
          <button data-base="plan_ign" aria-pressed="true" data-t="baseIgn">Plan IGN</button>
          <button data-base="imagery" aria-pressed="false" data-t="baseSatellite">Satellite</button>
          <button data-base="plain" aria-pressed="false" data-t="basePlain">Sobre</button>
        </div>
      </div>

      <!-- A contact sheet, not a slider. The newest image is often the worst
           one — cloud, or a pass that missed — and a bare slider made a reader
           scrub onto each date to find that out. One real tile per day, so the
           choice is made by looking. -->
      <div class="scrubber sheet" id="scrubber" hidden>
        <div class="scrub-head">
          <span id="scrub-label" data-t="scrubLabel">Date de l'image</span><b id="scrub-date"></b>
        </div>
        <div class="film" id="film" role="group"
             data-t-aria="ariaFilm" aria-label="Choisir la date de l'image"></div>
        <!-- Resolution and how often the sensor looks: the two facts that decide
             whether a layer can answer the question being asked. -->
        <div class="sensor" id="sensor-facts" hidden>
          <b id="sensor-res"></b><span id="sensor-revisit"></span>
        </div>
        <label class="opacity" for="imagery-opacity">
          <span id="opacity-label" data-t="opacityLabel">Opacité</span>
          <input type="range" id="imagery-opacity" min="0" max="100" value="85" step="5">
          <b id="opacity-value">85 %</b>
        </label>
        <div class="scrub-foot"><span id="scrub-note"></span></div>
      </div>

      <div class="scrubber days" id="day-scrubber" hidden>
        <div class="scrub-head">
          <span id="day-label" data-t="dayLabel">Jour</span><b id="day-date"></b>
        </div>
        <input type="range" id="day" min="0" max="6" value="6" step="1">
        <div class="scrub-foot"><span id="day-note"></span></div>
      </div>

      <!-- What the colours mean. Without this a reader has to guess whether an
           orange dot is a fire now or a fire on Tuesday, which is the difference
           between leaving and staying. -->
      <details class="legend" id="legend" open>
        <summary id="legend-title" data-t="legendTitle">Légende</summary>
        <ul id="legend-list"></ul>
      </details>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="../js/local-page.js"></script>
</body>
</html>
