<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D'où viennent ces informations — Feux Près De Moi</title>
  <meta name="description" content="Toutes les sources derrière la carte des feux en France : qui les publie, quand nous les avons vérifiées, et surtout ce que cette carte ne peut pas voir.">
  <!-- Relative, not root-absolute: the site ships to a project page served from
       /fire-app/, where /css/app.css resolves to the domain root and 404s. -->
  <link rel="stylesheet" href="../css/app.css">
  <style>
    /* Page layout only. Everything visual comes from app.css. */
    body { overflow: auto; }
    .doc {
      max-width: 44rem; margin: 0 auto; min-height: 100dvh;
      border-right: 1px solid var(--line); border-left: 1px solid var(--line);
    }
    .doc-head { position: sticky; top: 0; z-index: 1; background: var(--surface); }
    .doc-head nav { display: flex; gap: 12px; align-items: center; }
    .prose { padding: 22px 20px 4px; }
    .prose h1 { margin: 0; font-size: 1.7rem; line-height: 1.22; letter-spacing: -0.022em; }
    .prose h2 {
      margin: 34px 0 0; font-size: 1.2rem; letter-spacing: -0.012em;
      padding-top: 20px; border-top: 1px solid var(--line-soft);
    }
    .prose h3 { margin: 26px 0 2px; font-size: 1.02rem; }
    .prose p { margin: 9px 0 0; color: var(--muted); font-size: 0.97rem; }
    .prose ul { margin: 9px 0 0; padding-left: 1.15rem; color: var(--muted); font-size: 0.97rem; }
    .prose li { margin-bottom: 7px; }
    .doc a { color: var(--accent); text-underline-offset: 3px; }
    .src { padding: 0 20px; }
    .src .facts { margin-top: 12px; border-top: 1px solid var(--line-soft); }
    .fact dd a { font-size: 0.84rem; }
    .fact dd .tag { font-size: 0.62rem; }
    /* Coverage rows are read as sentences, not scanned as labels, so they drop
       the uppercase mono treatment .fact dt uses elsewhere. */
    .fact.area { grid-template-columns: 1fr minmax(0, auto); }
    .fact.area dt {
      font-family: var(--sans); font-size: 0.97rem; letter-spacing: 0;
      text-transform: none; color: var(--ink);
    }
    .fact.area dt b { font-family: var(--mono); font-size: 0.8rem; color: var(--faint); font-weight: 400; }
    .fact.area dd { text-align: right; word-break: break-word; }
  </style>
</head>
<body>
  <main class="rail doc" id="doc">
    <div class="rail-head doc-head">
      <div class="brand">Feux<span>·</span>Près<span>·</span>De<span>·</span>Moi</div>
      <nav>
        <a class="btn-ghost" href="./" id="back">Voir la carte</a>
        <button class="btn-ghost" id="lang">English</button>
      </nav>
    </div>

    <div id="content" aria-live="polite">
      <div class="prose"><p id="loading">Chargement…</p></div>
    </div>

    <div class="rail-foot">
      <span class="live" id="freshness"><i></i><span id="freshness-text"></span></span>
      <span id="generated"></span>
    </div>
  </main>

  <script type="module" src="../js/sources-fr.js"></script>
</body>
</html>
