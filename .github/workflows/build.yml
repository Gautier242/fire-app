name: build

# Stopped 2026-08-30. The Gironde fire is out and the owner is no longer using
# the site, so there is nothing to refresh every half hour -- only failing runs
# to mail about. The last successful deploy keeps serving on Pages for as long
# as the repository exists, and archive/ holds the fire itself, day by day, in
# git.
#
# To bring it back: run it once from the Actions tab, or restore the schedule
# below. It is ready to run -- the size failure that was mailing about itself
# when this stopped is fixed in cwfis_history.thin(), and a full build plus
# tests/test_budget.py was run against live sources on 2026-08-30 to confirm it.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/30 * * * *'
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      # public/data is gitignored, so a fresh checkout carries no history and a
      # failing source would have nothing to carry forward. --seed-from pulls
      # this build's own published summary back down first, so build.main can
      # keep the last good data flagged stale with its real age.
      #
      # It derives the URL from --out rather than taking one, because it used to
      # be a curl here that named Canada's path only. France therefore rebuilt
      # from nothing every run, and when FIRMS went down on 4 August 2026 it
      # published 0 fires, the publish gate refused to deploy, and the whole
      # site -- Canada included -- froze on 4 August data for nine days.
      #
      # Six upstream sources, each 3 attempts x 30s timeout plus backoff.
      # OpenSky credentials are optional: without them the aircraft layer is
      # flagged stale and every other source still publishes.
      - name: Build data
        timeout-minutes: 10
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python -m build.main --out public/data --country ca --seed-from "$SITE"

      # France is built separately so its failure cannot take Canada down. The
      # Canadian site is live and answers an evacuation question; a French
      # source outage must not block it.
      - name: Build France data
        timeout-minutes: 10
        continue-on-error: true
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python -m build.main --out public/fr/data --country fr --seed-from "$SITE"

      # Zones are an optimisation: the browser fetches the same data live, so a
      # missing zone index costs speed and offline availability, never coverage.
      # Reported rather than fatal - it must not block publishing the danger
      # level or the fire layer.
      - name: Report pre-built zones
        continue-on-error: true
        run: |
          python - <<'EOF'
          import json, pathlib
          index = pathlib.Path("public/fr/data/zones/index.json")
          if not index.exists():
              print("no zone index written; the local view will fetch live everywhere")
          else:
              zones = json.loads(index.read_text())["zones"]
              print(f"pre-built zones: {len(zones)}")
              for z in zones:
                  print(f"  {z['id']:14} {z['reason']:8} r={z['radius_km']}km")
          EOF

      # A stale section with an honest timestamp is publishable. A section that
      # is empty *because its fetch failed* is not - deploying that would show
      # an all-clear map. Blocking here leaves the last good deploy serving.
      - name: Refuse to publish missing sections
        run: |
          python - <<'EOF'
          import json, os, sys
          from build.main import sections_for, critical_sections

          problems = []

          for country, path in (("ca", "public/data/summary.json"),
                                ("fr", "public/fr/data/summary.json")):
              if not os.path.exists(path):
                  if country == "ca":
                      sys.exit("refusing to publish: the Canadian summary is missing")
                  print(f"{country}: no summary written; the previous deploy keeps serving")
                  continue
              summary = json.load(open(path))
              owners = sections_for(country)
              failed = {s["id"] for s in summary["sources"] if not s["ok"]}
              counts = {k: len(v) for k, v in summary.items()
                        if isinstance(v, list) and k != "sources"}
              print(f"{country}: {counts}")
              print(f"{country}: stale sources:", ", ".join(sorted(failed)) or "none")
              for section in critical_sections(country):
                  if not summary.get(section) and any(owners[i] == section for i in failed):
                      problems.append(f"{country}/{section}")

          if problems:
              sys.exit(f"refusing to publish: {', '.join(problems)} empty after fetch failure")
          EOF

      - name: Check size budget
        run: pytest tests/test_budget.py -q

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
