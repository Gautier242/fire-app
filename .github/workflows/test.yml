name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements.txt
      - run: pytest -q
      # The glob is required: node --test only auto-discovers *.test.js,
      # *_test.js, test-*.js, or files under a dir named test. Ours are
      # test_geo.js and friends, so a bare directory arg finds nothing.
      - run: node --test tests-js/*.js
